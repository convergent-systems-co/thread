version: 2
project_name: thread
before:
  hooks:
    - go test -race ./...
    - go vet ./...
builds:
  - id: thread
    main: ./cmd/thread
    binary: thread
    env: ["CGO_ENABLED=0"]
    ldflags: ["-s -w -X main.version={{.Version}}"]
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
archives:
  - id: default
    builds: [thread]
    name_template: "thread_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [README.md, LICENSE]
checksum:
  name_template: checksums.txt
release:
  draft: false
  prerelease: auto
changelog:
  use: git
  sort: asc
  filters:
    exclude: ["^test:", "^chore:"]
